apis:
- name: Outpost Tax of Record API
  description: >-
    REST API that automates tax registration, calculation, and filing while the
    merchant keeps their own checkout and PSP. Server-to-server, OAuth2
    client-credentials. Covers tax calculations, tax transactions, refunds,
    transaction invoices, and product-catalogue import (including Brazil NFS-e).
  humanURL: https://outpostnow.com/docs/api/tax-of-record/
  baseURL: https://api.outpostanywhere.com
  tags:
  - Tax of Record
  - Tax Calculation
  - Compliance
  properties:
  - type: Documentation
    url: https://outpostnow.com/docs/api/tax-of-record/
  - type: APIReference
    url: https://outpostnow.com/docs/api/tax-of-record/
- name: Outpost Merchant of Record API
  description: >-
    REST API to issue proforma invoices for B2B customers paying by bank
    transfer, receive settlement webhooks, and retrieve tax invoices for
    payments and refunds processed through Outpost. Server-to-server, OAuth2
    client-credentials.
  humanURL: https://outpostnow.com/docs/api/merchant-of-record/
  baseURL: https://api.outpostanywhere.com
  tags:
  - Merchant of Record
  - Invoicing
  - Webhooks
  properties:
  - type: Documentation
    url: https://outpostnow.com/docs/api/merchant-of-record/
  - type: APIReference
    url: https://outpostnow.com/docs/api/merchant-of-record/
- name: Outpost Hosted Onboarding (Partner) API
  description: >-
    Partner REST API to onboard existing merchants onto Outpost services with a
    hosted onboarding UI and asynchronous review workflow. JWT bearer auth,
    /partner/api prefix, staging and production environments.
  humanURL: https://outpostnow.com/docs/api/hosted-onboarding/
  baseURL: https://partner.outpostanywhere.com
  tags:
  - Onboarding
  - Partner
  properties:
  - type: Documentation
    url: https://outpostnow.com/docs/api/hosted-onboarding/
  - type: APIReference
    url: https://outpostnow.com/docs/api/hosted-onboarding/

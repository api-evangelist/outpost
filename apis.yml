name: Outpost
description: >-
  Outpost is a Merchant of Record and Tax of Record platform for cross-border
  commerce, letting retailers sell into new markets while Outpost takes on the
  legal and tax liability — local payments, VAT/GST/sales-tax registration,
  calculation and filing, proforma invoicing for B2B bank transfers, and hosted
  merchant onboarding. Its server-to-server REST APIs (Tax of Record, Merchant
  of Record, and Hosted Onboarding) use OAuth2 client-credentials and JWT bearer
  authentication so merchants keep their own checkout and payment service
  providers (Stripe, Adyen) while Outpost handles compliance across
  jurisdictions. Founded by ex-Revolut operator Will Mahon-Heap and backed by
  Ribbit Capital and Better Tomorrow Ventures.
